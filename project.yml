name: Notched
options:
  bundleIdPrefix: app.notched
  deploymentTarget:
    # The flotion-test VM runs macOS 26; keep the app runnable there.
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  NotchedKit:
    path: Packages/NotchedKit
targets:
  Notched:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      # Run by /usr/bin/perl with the framework below; see App/Media/AdapterSource.swift.
      - path: Vendor/MediaRemoteAdapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - package: NotchedKit
        product: NotchedCore
      # Loaded by perl, never by Notched: embedded in Contents/Frameworks but not linked.
      - target: MediaRemoteAdapter
        link: false
        embed: true
        codeSign: true
      # The hook helper ships inside the app; Scripts/agent-hooks.sh copies it to a stable path.
      - target: notched-agent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        # UNUserNotificationCenter needs a bundle identifier.
        PRODUCT_BUNDLE_IDENTIFIER: app.notched.Notched
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notched
        # An agent app: no Dock icon and no menu bar of its own. The notch is the whole UI.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
  notched-agent:
    type: tool
    platform: macOS
    sources:
      - Agent
      - Shared
    dependencies:
      - package: NotchedKit
        product: NotchedCore
    settings:
      base:
        PRODUCT_NAME: notched-agent
        PRODUCT_BUNDLE_IDENTIFIER: app.notched.agent
  # ungive/mediaremote-adapter, vendored unchanged (Scripts/vendor-mediaremote-adapter.sh).
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/MediaRemoteAdapter/src
        headerVisibility: project
      - path: Vendor/MediaRemoteAdapter/include
        headerVisibility: project
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notched.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        # perl finds the adapter's entry points by name, so they must stay exported.
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/MediaRemoteAdapter/include", "$(SRCROOT)/Vendor/MediaRemoteAdapter/src"]
        OTHER_LDFLAGS: ["-framework", "AppKit", "-framework", "UniformTypeIdentifiers"]
        # Upstream code, kept byte-for-byte: its warnings are upstream's to fix.
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
schemes:
  Notched:
    build:
      targets:
        Notched: all
    run:
      config: Debug
